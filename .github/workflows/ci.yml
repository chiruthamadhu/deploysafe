name: DeploySafe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m py_compile src/deploysafe/analyzer.py
          python -m py_compile src/deploysafe/report.py
          python -m py_compile src/deploysafe/cli.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test risky Terraform plan
        run: |
          set +e
          python -m src.deploysafe.cli examples/risky/terraform-plan.json
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo "Expected exit code 1 for risky plan, got $result"
            exit 1
          fi

      - name: Test safe Terraform plan
        run: python -m src.deploysafe.cli examples/safe/terraform-plan.json
